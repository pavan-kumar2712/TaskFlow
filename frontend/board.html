<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Board</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/board.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Task<span>Flow</span></div>
    <div class="top-actions">
      <button class="btn ghost" onclick="location.href='dashboard.html'">← Dashboard</button>
      <button class="btn ghost" onclick="logout()">Logout</button>
    </div>
  </header>

  <main class="container board-page">
    <div class="page-head">
      <div>
        <p class="eyebrow">PROJECT BOARD</p>
        <h1 id="boardTitle">Loading...</h1>
        <p id="boardDescription" class="muted"></p>
      </div>
      <button class="btn primary" onclick="openTaskModal()">+ Add Task</button>
    </div>

    <div class="kanban">
      <section class="kanban-col">
        <div class="col-head"><h3>To Do</h3><span id="todoCount">0</span></div>
        <div id="todoList" class="task-list"></div>
      </section>
      <section class="kanban-col">
        <div class="col-head"><h3>In Progress</h3><span id="progressCount">0</span></div>
        <div id="progressList" class="task-list"></div>
      </section>
      <section class="kanban-col">
        <div class="col-head"><h3>Done</h3><span id="doneCount">0</span></div>
        <div id="doneList" class="task-list"></div>
      </section>
    </div>
  </main>

  <div id="taskModal" class="modal hidden">
    <div class="modal-card large">
      <div class="modal-head"><h2 id="taskModalTitle">New Task</h2><button class="icon-btn" onclick="closeTaskModal()">×</button></div>
      <form id="taskForm">
        <input type="hidden" id="taskId">
        <div class="form-grid">
          <div class="span-2">
            <label>Task title</label>
            <input id="taskTitle" required placeholder="e.g. Design login page">
          </div>
          <div class="span-2">
            <label>Description</label>
            <textarea id="taskDescription" rows="3" placeholder="Task details"></textarea>
          </div>
          <div>
            <label>Status</label>
            <select id="taskStatus"><option>To Do</option><option>In Progress</option><option>Done</option></select>
          </div>
          <div>
            <label>Priority</label>
            <select id="taskPriority"><option>Low</option><option selected>Medium</option><option>High</option></select>
          </div>
          <div>
            <label>Assigned to (user ID)</label>
            <input id="taskAssignee" type="number" min="1" placeholder="Optional">
          </div>
          <div>
            <label>Due date</label>
            <input id="taskDueDate" type="date">
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn ghost" onclick="closeTaskModal()">Cancel</button>
          <button type="submit" class="btn primary">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/board.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="brand">Task<span>Flow</span></div>
    <p class="muted">Create your workspace account</p>
    <h1>Create account</h1>
    <form id="registerForm">
      <label>Full name</label>
      <input id="name" required placeholder="Your name">
      <label>Email</label>
      <input id="email" type="email" required placeholder="you@example.com">
      <label>Password</label>
      <input id="password" type="password" minlength="6" required placeholder="Minimum 6 characters">
      <button class="btn primary full" type="submit">Register</button>
    </form>
    <p id="message" class="message"></p>
    <p class="switch">Already have an account? <a href="index.html">Login</a></p>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
